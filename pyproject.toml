[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-ai-world"
version = "0.12.0"
description = "An autonomous voiced digital circus with procedural 3D navigation and resilient live sync"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Autonomous AI World contributors" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
ai-world = "autonomous_ai_world.cli:main"
ai-world-web = "autonomous_ai_world.web_server:main"

[tool.setuptools.package-data]
autonomous_ai_world = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
