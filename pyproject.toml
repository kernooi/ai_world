[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-ai-world"
version = "0.8.0"
description = "A persistent observer-only autonomous character simulation through Stage 8"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Autonomous AI World contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ai-world = "autonomous_ai_world.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
